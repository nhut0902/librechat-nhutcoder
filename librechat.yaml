# LibreChat configuration for NhutCoder deployment
# MCP servers: Zernio (social media posting) + Composio (automation) + Cloudinary (image upload)
# AI providers: OpenRouter (15 free models) + NVIDIA NIM (llama-3.1-70b verified)
#
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.13

cache: true

# File storage: local (Cloudinary MCP for image fetching)
fileStrategy: local

# ─────────────────────────────────────────────────────────────────────────────
# AI Provider Endpoints
# ─────────────────────────────────────────────────────────────────────────────
# Built-in providers (OpenAI, Anthropic, Google) auto-appear if env var is set.
# - OpenAI:     set OPENAI_API_KEY in Render env vars → endpoint appears
# - Anthropic:  set ANTHROPIC_API_KEY in Render env vars → endpoint appears
# - Google:     blocked by region (Render Singapore) — skipped
#
# Custom OpenAI-compatible providers go under `endpoints.custom`.
endpoints:
  custom:
    # ── OpenRouter (15 free models, verified working Aug 2026) ──
    # Free models confirmed via API: openai/gpt-oss-20b:free, nvidia/nemotron-3-ultra-550b-a55b:free,
    # google/gemma-4-31b-it:free, nvidia/nemotron-3-super-120b-a12b:free, etc.
    - name: 'OpenRouter Free'
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          # ── Verified free models (Aug 2026) ──
          - 'openai/gpt-oss-20b:free'                              # OpenAI GPT-OSS 20B (free)
          - 'nvidia/nemotron-3-ultra-550b-a55b:free'              # NVIDIA Nemotron 3 Ultra 550B (free)
          - 'nvidia/nemotron-3-super-120b-a12b:free'              # NVIDIA Nemotron 3 Super 120B (free)
          - 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free'  # NVIDIA Nemotron 3 Nano Omni 30B (free, reasoning)
          - 'nvidia/nemotron-3-nano-30b-a3b:free'                 # NVIDIA Nemotron 3 Nano 30B (free)
          - 'google/gemma-4-31b-it:free'                          # Google Gemma 4 31B (free)
          - 'google/gemma-4-26b-a4b-it:free'                      # Google Gemma 4 26B (free)
          - 'nvidia/nemotron-nano-12b-v2-vl:free'                 # NVIDIA Nemotron Nano 12B v2 VL (free, vision)
          - 'nvidia/nemotron-nano-9b-v2:free'                     # NVIDIA Nemotron Nano 9B v2 (free)
          - 'cohere/north-mini-code:free'                         # Cohere North Mini Code (free)
          - 'liquid/lfm-2.5-2.6b:free'                            # Liquid LFM 2.5 2.6B (free, fast)
        fetch: false
      titleConvo: true
      titleModel: 'openai/gpt-oss-20b:free'
      modelDisplayLabel: 'OpenRouter (Free)'

    # ── NVIDIA NIM (free credits, 102 models available) ──
    # Verified working: meta/llama-3.1-70b-instruct
    # Note: Many NIM models return 404/empty — only llama-3.1-70b is stable.
    - name: 'NVIDIA NIM'
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: 'https://integrate.api.nvidia.com/v1'
      models:
        default:
          - 'meta/llama-3.1-70b-instruct'      # ✅ verified working
          - 'meta/llama-3.1-8b-instruct'       # smaller, faster
          - 'meta/llama-3.2-3b-instruct'       # smallest, fastest
          - 'meta/llama-3.2-1b-instruct'       # edge model
        fetch: false
      titleConvo: true
      titleModel: 'meta/llama-3.1-8b-instruct'
      modelDisplayLabel: 'NVIDIA NIM'

# ─────────────────────────────────────────────────────────────────────────────
# MCP (Model Context Protocol) servers
# ─────────────────────────────────────────────────────────────────────────────
# These give the LLM tools to: post to social media (Zernio),
# automate tasks (Composio), upload images (Cloudinary).
mcpServers:
  # ── Zernio: AI social media management ──
  # Post/schedule to TikTok, Facebook, Instagram, YouTube, LinkedIn, Twitter, Threads.
  zernio:
    type: http
    url: https://mcp.zernio.com/mcp
    headers:
      Authorization: "Bearer ${ZERNIO_API_KEY}"
    timeout: 60000

  # ── Composio: 1000+ app integrations for AI automation ──
  # Connect Gmail, Slack, Notion, GitHub, Calendar, etc. via single MCP server.
  composio:
    type: http
    url: https://mcp.composio.dev/mcp
    headers:
      x-api-key: "${COMPOSIO_API_KEY}"
    timeout: 60000

  # ── Cloudinary: Image upload & management ──
  # Used by AI to: fetch image from web → upload to Cloudinary → get direct URL → pass to Zernio for posting.
  # Cloud name: tfbfthxq (free tier)
  cloudinary-asset-mgmt:
    type: http
    url: https://asset-management.mcp.cloudinary.com/mcp
    headers:
      cloudinary-url: "cloudinary://${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@tfbfthxq"
    timeout: 60000
