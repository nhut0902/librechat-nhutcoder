# LibreChat configuration for NhutCoder deployment
# MCP servers: Zernio (social media posting) + Composio (automation) + Cloudinary (image upload)
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.13

cache: true

# File storage: use local (Render volume) — Cloudinary MCP for image fetching
fileStrategy: local

# Interface config
# apiKey: user_provided (string literal) → user enters their own key in Settings → AI
interface:
  endpoints:
    - name: "OpenAI"
      apiKey: user_provided
      models:
        default: ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo", "gpt-3.5-turbo", "o1-preview", "o1-mini"]
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "gpt-4o-mini"
      summarize: false
      summaryModel: "gpt-4o-mini"
      forcePrompt: false
      modelDisplayLabel: "OpenAI"

    - name: "Anthropic"
      apiKey: user_provided
      models:
        default: ["claude-3-5-sonnet-20241022", "claude-3-5-haiku-20241022", "claude-3-opus-20240229"]
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "claude-3-5-haiku-20241022"
      summarize: false
      summaryModel: "claude-3-5-haiku-20241022"
      modelDisplayLabel: "Anthropic"

    - name: "Google"
      apiKey: user_provided
      models:
        default: ["gemini-1.5-pro", "gemini-1.5-flash", "gemini-2.0-flash-exp"]
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "gemini-1.5-flash"
      summarize: false
      summaryModel: "gemini-1.5-flash"
      modelDisplayLabel: "Google"

    - name: "Groq"
      apiKey: user_provided
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "llama-3.1-8b-instant"
          - "mixtral-8x7b-32768"
          - "gemma2-9b-it"
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "llama-3.1-8b-instant"
      summarize: false
      summaryModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq"
      addParams:
        extra_body: {}

    - name: "OpenRouter"
      apiKey: user_provided
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "anthropic/claude-3.5-sonnet"
          - "openai/gpt-4o"
          - "openai/gpt-4o-mini"
          - "google/gemini-2.0-flash-exp:free"
          - "meta-llama/llama-3.3-70b-instruct"
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "openai/gpt-4o-mini"
      summarize: false
      summaryModel: "openai/gpt-4o-mini"
      modelDisplayLabel: "OpenRouter"

    - name: "NVIDIA NIM"
      apiKey: user_provided
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default:
          - "meta/llama-3.3-70b-instruct"
          - "meta/llama-3.1-405b-instruct"
          - "meta/llama-3.1-70b-instruct"
          - "nvidia/llama-3.1-nemotron-70b-instruct"
          - "mistralai/mixtral-8x22b-instruct-v0.1"
          - "google/gemma-2-27b-it"
          - "microsoft/phi-3-medium-4k-instruct"
          - "deepseek-ai/deepseek-r1"
        fetch: true
      titleConvo: true
      titleMethod: "client"
      titleModel: "meta/llama-3.1-70b-instruct"
      summarize: false
      summaryModel: "meta/llama-3.1-70b-instruct"
      modelDisplayLabel: "NVIDIA NIM"
      addParams:
        extra_body: {}

# MCP (Model Context Protocol) servers
# These give the LLM tools to: post to social media (Zernio), automate tasks (Composio), upload images (Cloudinary)
mcpServers:
  # ── Zernio: AI social media management ──
  # Post/schedule to TikTok, Facebook, Instagram, YouTube, LinkedIn, Twitter, Threads.
  zernio:
    type: http
    url: https://mcp.zernio.com/mcp
    headers:
      Authorization: "Bearer ${ZERNIO_API_KEY}"
    timeout: 60000

  # ── Composio: 1000+ app integrations for AI automation ──
  # Connect Gmail, Slack, Notion, GitHub, Calendar, etc. via single MCP server.
  composio:
    type: http
    url: https://mcp.composio.dev/mcp
    headers:
      x-api-key: "${COMPOSIO_API_KEY}"
    timeout: 60000

  # ── Cloudinary: Image upload & management ──
  # Used by AI to: fetch image from web → upload to Cloudinary → get direct URL → pass to Zernio for posting.
  # Cloud name: tfbfthxq (free tier)
  cloudinary-asset-mgmt:
    type: http
    url: https://asset-management.mcp.cloudinary.com/mcp
    headers:
      cloudinary-url: "cloudinary://${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@tfbfthxq"
    timeout: 60000
